<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rainium lyrics video</title>
<!-- Rainium runs JIZURA (MIT, see LICENSE.txt) here, off screen, and shows what it draws in the world. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@300;500;700;900&family=Noto+Serif+JP:wght@300;500;700&family=Zen+Kaku+Gothic+New:wght@900&family=Zen+Old+Mincho:wght@900&family=Kaisei+Tokumin:wght@800&family=M+PLUS+Rounded+1c:wght@800&family=Mochiy+Pop+One&family=DotGothic16&family=Yuji+Syuku&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>html, body { margin: 0; background: transparent; overflow: hidden; } canvas { display: block; }</style>
<script src="engine.js"></script>
</head>
<body>
<canvas id="out" width="1600" height="450"></canvas>
<script>
// The page is two layers side by side: JIZURA's back layer (decorations behind the lyrics) on the left,
// its front layer (the lyrics and the rest) on the right. Rainium shows each half on its own plane.
(() => {
  'use strict';
  const out = document.getElementById('out'), octx = out.getContext('2d');
  const back = document.createElement('canvas'), front = document.createElement('canvas');
  const S = { w: 800, h: 450, plan: null, r: null, at: 0, base: performance.now(), playing: false, step: null, key: '' };

  function size(w, h) {
    S.w = w; S.h = h;
    out.width = w * 2; out.height = h;
    back.width = front.width = w; back.height = front.height = h;
    S.step = null;
  }

  // a new song (or new look): build JIZURA's plan exactly as its website does, minus its background graphics
  function song(lrc, projectJson, key) {
    try {
      const p = Object.assign(J.defaultProject(), projectJson ? JSON.parse(projectJson) : {});
      p.lyrics = lrc;
      S.plan = J.plan(p, null);
      S.plan.cuts.forEach(c => { c.bg = 'none'; });       // never cover the world
      S.r = S.r || new J.Renderer();
      S.key = key || '';
      S.step = null;
      J.ensureFonts(lrc.replace(/\[[^\]]*\]/g, '') + '0123456789XYLINEREC:/.No', null).then(() => { S.step = null; }).catch(() => {});
    } catch (e) {
      S.plan = null;
      document.title = 'error: ' + e.message;
    }
  }

  function clear() { S.plan = null; octx.clearRect(0, 0, out.width, out.height); S.step = null; }

  // the song position from the game, about four times a second; the page keeps time in between
  function time(t, playing) { S.at = t; S.base = performance.now(); S.playing = !!playing; }
  function now() { return S.at + (S.playing ? (performance.now() - S.base) / 1000 : 0); }

  function frame() {
    requestAnimationFrame(frame);
    const plan = S.plan;
    if (!plan) return;
    const t = now();
    // JIZURA draws its motion in steps (12 a second by default): draw only when the step changes
    const step = Math.floor(t / J.stepDur(plan.fx, plan.fps) + 1e-6);
    if (step === S.step) return;
    S.step = step;
    octx.clearRect(0, 0, out.width, out.height);
    if (t < -0.5 || t > plan.duration + 1) return;
    try {
      S.r.frame(back.getContext('2d'), plan, t, { scale: S.w / plan.W, transparent: true, layer: 'back' });
      S.r.frame(front.getContext('2d'), plan, t, { scale: S.w / plan.W, transparent: true, layer: 'front' });
      octx.drawImage(back, 0, 0);
      octx.drawImage(front, S.w, 0);
    } catch (e) {
      document.title = 'error: ' + e.message;
    }
  }

  window.rainium = { size, song, clear, time };
  size(800, 450);
  requestAnimationFrame(frame);
  document.title = 'ready';
})();
</script>
</body>
</html>
