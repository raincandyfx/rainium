name: Build & release

# Every push to main is built to check it still compiles.
# Pushing a tag like v0.1.5 builds that version and publishes it as a GitHub release
# (the version comes from the tag); the in-game updater picks releases up from there.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          args=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then args="-Pmod_version=${GITHUB_REF_NAME#v}"; fi
          if ! ./gradlew build $args 2>&1 | tee build.log; then
            # surface the cause as annotations, which show on the run page without opening the log
            grep -E -A8 "What went wrong|error:|Could not" build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ if (p) exit; p = ($2 == v) ; next } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Rainium $v" > notes.md; fi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Rainium ${{ github.ref_name }}
          body_path: notes.md
          # rainium-<version>+<minecraft>.jar: the in-game updater looks for exactly this name
          files: |
            build/libs/rainium-*.jar
          fail_on_unmatched_files: true
